# LeoDeepAI 发布构建（公开仓库 → Actions 分钟数免费不限量）
#
# 为什么放在这里:主仓库 LeoCodePlay/Teleforge 是私有仓库,Actions 走 2000 分钟/月额度
# (macOS ×10、Windows ×2 倍计费),发布一次就烧掉大半,额度用尽后 CI 完全无法启动。
# 本仓库是**公开**的,公开仓库的标准 runner 分钟数免费、不限量,也不会占用私库额度。
#
# 做法:只取源码、不推源码 —— checkout 主仓库(用 SOURCE_TOKEN 读私有仓库),
# 构建完把安装包直接上传到本仓库的 Release。本仓库里**没有任何源码**,只有 Release。
#
# 触发:
#   - 推送 tag v*（例如 v0.6.2）→ 构建三平台并发布/更新对应 Release
#   - 手动 workflow_dispatch，可只构建指定平台
name: release-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.6.2，需与源码 package.json 一致）"
        required: true
      platforms:
        description: "构建平台（all / windows / macos / linux）"
        required: false
        default: all

permissions:
  contents: write

env:
  SOURCE_REPO: LeoCodePlay/Teleforge
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: 解析版本号
        id: v
        run: |
          REF="${{ env.SOURCE_REF }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "源引用: $REF"

  windows-x64:
    needs: prepare
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-latest
    steps:
      - name: 取源码（私有主仓库，只读）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        working-directory: src
        run: npm ci

      - name: 版本号一致性
        working-directory: src
        run: node scripts/check-versions.mjs

      - name: 构建 Windows 安装包
        working-directory: src
        run: npx tauri build --bundles nsis

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ env.SOURCE_REF }}"
          $files = Get-ChildItem src/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName }
          if (-not (gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null)) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "LeoDeepAI $tag" --generate-notes
          }
          gh release upload $tag $files --repo "$env:GITHUB_REPOSITORY" --clobber

  macos-arm64:
    needs: prepare
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装依赖
        working-directory: src
        run: npm ci
      - name: 版本号一致性
        working-directory: src
        run: node scripts/check-versions.mjs
      - name: 构建 macOS arm64 dmg
        working-directory: src
        run: npx tauri build --bundles dmg
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ env.SOURCE_REF }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "LeoDeepAI $tag" --generate-notes
          fi
          gh release upload "$tag" src/src-tauri/target/release/bundle/dmg/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  macos-x64:
    needs: prepare
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装依赖
        working-directory: src
        run: npm ci
      - name: 版本号一致性
        working-directory: src
        run: node scripts/check-versions.mjs
      - name: 构建 macOS x64 dmg
        working-directory: src
        run: npx tauri build --bundles dmg
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ env.SOURCE_REF }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "LeoDeepAI $tag" --generate-notes
          fi
          gh release upload "$tag" src/src-tauri/target/release/bundle/dmg/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  linux-x64:
    needs: prepare
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri
      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装依赖
        working-directory: src
        run: npm ci
      - name: 版本号一致性
        working-directory: src
        run: node scripts/check-versions.mjs
      - name: 构建 Linux 安装包
        working-directory: src
        run: npx tauri build --bundles deb,appimage
        env:
          NO_STRIP: "true"
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ env.SOURCE_REF }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "LeoDeepAI $tag" --generate-notes
          fi
          gh release upload "$tag" \
            src/src-tauri/target/release/bundle/deb/*.deb \
            src/src-tauri/target/release/bundle/appimage/*.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [windows-x64, macos-arm64, macos-x64, linux-x64]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: 转正 Release（标记 latest，应用内自动更新据此判断）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ env.SOURCE_REF }}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets --jq '{tagName,isDraft,assets:[.assets[].name]}'